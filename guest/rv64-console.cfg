/* Bellard's riscv64 disk image (diskimage-linux-riscv-2018-09-23) on the serial console,
   without its network device. Fully local. Run guest/fetch.sh first. */
{
    version: 1,
    machine: "riscv64",
    memory_size: 128,
    bios: "cache/diskimage-linux-riscv-2018-09-23/bbl64.bin",
    kernel: "cache/diskimage-linux-riscv-2018-09-23/kernel-riscv64.bin",
    cmdline: "console=hvc0 root=/dev/vda rw",
    drive0: { file: "cache/diskimage-linux-riscv-2018-09-23/root-riscv64.bin" },
}
