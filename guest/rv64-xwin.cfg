/* The JSLinux RV64 X Window guest (https://bellard.org/jslinux/buildroot-riscv64-xwin.cfg)
   with local BIOS/kernel and no network device. Its root filesystem is still served over
   HTTP by vfsync.org (CONFIG_FS_NET). Run guest/fetch.sh first. */
{
    version: 1,
    machine: "riscv64",
    memory_size: 256,
    bios: "cache/bbl64.bin",
    kernel: "cache/kernel-riscv64.bin",
    cmdline: "loglevel=3 swiotlb=1 console=tty0 root=root rootfstype=9p rootflags=trans=virtio ro TZ=${TZ}",
    fs0: { file: "https://vfsync.org/u/os/buildroot-riscv64" },
    display0: {
        device: "simplefb",
        width: 1024,
        height: 640,
    },
    input_device: "virtio",
}
